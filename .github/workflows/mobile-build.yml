name: mobile-cross-compile

on: [push, pull_request]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev pkg-config libfontconfig1-dev
      - name: Install Rust and Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-linux-android
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install "ndk;27.3.13750724"
          ndk="$ANDROID_HOME/ndk/27.3.13750724"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          rustc +1.95.0 -vV > out/android/toolchain.txt
          "$sdkmanager" --version >> out/android/toolchain.txt
          grep '^Pkg.Revision' "$ndk/source.properties" >> out/android/toolchain.txt
          "$bin/aarch64-linux-android26-clang" --version >> out/android/toolchain.txt
      - name: Record Android dependency tree
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 tree --locked -e normal --target aarch64-linux-android -p isr 2>&1 | tee out/android/cargo-tree.txt
      - name: Cross-compile Android API 26 binary
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 build --locked --release -p isr --target aarch64-linux-android 2>&1 | tee out/android/build.log
          cp target/aarch64-linux-android/release/isr out/android/isr
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-size" out/android/isr | tee out/android/size.txt
          wc -c < out/android/isr > out/android/binary-bytes.txt
      - name: Upload Android evidence (including partial logs on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-android
          path: out/android/
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Rust and iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ios
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=$(xcrun --sdk iphoneos --find clang)" >> "$GITHUB_ENV"
          libclang="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if test -f "$libclang/libclang.dylib"; then
            echo "LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"
          fi
          rustc +1.95.0 -vV > out/ios/toolchain.txt
          xcodebuild -version >> out/ios/toolchain.txt
          xcrun --sdk iphoneos --show-sdk-version >> out/ios/toolchain.txt
          xcrun --sdk iphoneos --find clang >> out/ios/toolchain.txt
      - name: Record iOS dependency tree
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 tree --locked -e normal --target aarch64-apple-ios -p isr 2>&1 | tee out/ios/cargo-tree.txt
      - name: Cross-compile iOS binary
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 build --locked --release -p isr --target aarch64-apple-ios 2>&1 | tee out/ios/build.log
          cp target/aarch64-apple-ios/release/isr out/ios/isr
          xcrun --sdk iphoneos size out/ios/isr | tee out/ios/size.txt
          wc -c < out/ios/isr > out/ios/binary-bytes.txt
      - name: Upload iOS evidence (including partial logs on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-ios
          path: out/ios/
          if-no-files-found: warn
