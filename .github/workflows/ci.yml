name: week-2-parity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    # Keep browser userspace stable as the hosted runner OS advances.
    container: ubuntu:24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      RAYON_NUM_THREADS: 4
      REPORT_PATH: out/CI-REPORT.md
      RUSTFLAGS: --cfg svg_font_patch
    steps:
      - name: System dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential curl ca-certificates git python3 time zstd libclang-dev pkg-config libfontconfig1-dev fontconfig fonts-liberation strace
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Apply SVG font patch to pinned dependency
        run: bash patches/apply-blitz-svg-fonts.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build locked and record size/time
        run: |
          mkdir -p out
          /usr/bin/time -f '%e' -o out/build-seconds.txt cargo build --locked -j 4
          stat -c '%s' target/debug/isr > out/binary-bytes.txt
      - run: cargo test -j 4
      - name: Verify no host font file opens for default SVG renders
        run: |
          mkdir -p out
          test_bin="$(find target/debug/deps -maxdepth 1 -type f -executable -name 'isr_core-*' -print -quit)"
          test -n "$test_bin"
          strace -f -yy -e trace=openat,open -o out/no-system-fonts.strace "$test_bin" --test-threads=1 no_system_fonts
          if grep -E '(openat|open)\(' out/no-system-fonts.strace | grep -E '/(usr/share/fonts|usr/local/share/fonts|etc/fonts)(/|[>" ])|/\.fonts(/|[>" ])'; then
            echo "default SVG/font render opened a host font path" >&2
            exit 1
          fi
      - run: npm test
      - name: Render all fixtures in both engines
        run: npm run fixtures
      - name: Compare fixtures and isolated probes
        run: npm run compare
      - name: Parity regression gate (required)
        run: npm run gate
      - name: Job summary
        if: success()
        run: cat out/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: week-2-parity-${{ github.sha }}
          path: out/
