name: android-demo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.11.1'
      - name: Install host and Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev pkg-config libfontconfig1-dev
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-linux-android x86_64-linux-android
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install "ndk;27.3.13750724" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ndk="$ANDROID_HOME/ndk/27.3.13750724"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          test -x "$bin/x86_64-linux-android26-clang"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$bin/x86_64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CC_x86_64_linux_android=$bin/x86_64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CXX_x86_64_linux_android=$bin/x86_64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "AR_x86_64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Build both native cdylibs
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 build --locked --release -p isr-android --target aarch64-linux-android
          cargo +1.95.0 build --locked --release -p isr-android --target x86_64-linux-android
          mkdir -p android/demo/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/demo/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libisr_android.so android/demo/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libisr_android.so android/demo/app/src/main/jniLibs/x86_64/
      - name: Assemble debug and instrumented-test APKs
        shell: bash
        working-directory: android/demo
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Stage APKs and measured sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android-demo/apks
          apk=android/demo/app/build/outputs/apk/debug/app-debug.apk
          test_apk=android/demo/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cp "$apk" out/android-demo/apks/
          cp "$test_apk" out/android-demo/apks/
          {
            printf 'debug_apk_bytes=%s\n' "$(stat -c '%s' "$apk")"
            for abi in arm64-v8a x86_64; do
              lib="android/demo/app/src/main/jniLibs/$abi/libisr_android.so"
              printf '%s_unstripped_library_bytes=%s\n' "$abi" "$(stat -c '%s' "$lib")"
              printf '%s_packaged_library_bytes=%s\n' "$abi" "$(unzip -p "$apk" "lib/$abi/libisr_android.so" | wc -c)"
            done
          } | tee out/android-demo/apks/sizes.txt
          cat out/android-demo/apks/sizes.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APKs and size evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-demo-apks
          path: out/android-demo/apks/
          if-no-files-found: warn

  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-demo-apks
          path: out/android-demo/apks/
      - name: Install emulator image and require acceleration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android-demo/smoke
          if ! test -e /dev/kvm; then
            echo "::error::/dev/kvm is absent; emulator acceleration unavailable on this hosted runner"
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n isr-smoke -k "system-images;android-35;google_apis;x86_64" --force
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Boot accelerated x86_64 emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator -avd isr-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > out/android-demo/smoke/emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          booted=0
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            tail -100 out/android-demo/smoke/emulator.log
            echo "::error::Emulator failed to boot"
            exit 1
          fi
          adb shell input keyevent 82
      - name: Install APKs and run instrumented smoke
        shell: bash
        run: |
          set -euo pipefail
          adb install -r out/android-demo/apks/app-debug.apk
          adb install -r out/android-demo/apks/app-debug-androidTest.apk
          adb shell am instrument -w -r org.htmlnativerenderer.demo.test/androidx.test.runner.AndroidJUnitRunner \
            2>&1 | tee out/android-demo/smoke/instrumentation.txt
          grep -q 'OK (1 test)' out/android-demo/smoke/instrumentation.txt
      - name: Pull screenshot from instrumented test
        shell: bash
        run: |
          set -euo pipefail
          adb pull /sdcard/Android/data/org.htmlnativerenderer.demo/files/android-smoke.png out/android-demo/smoke/smoke.png
          test -s out/android-demo/smoke/smoke.png
      - name: Upload smoke log, screenshot and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-demo-smoke
          path: out/android-demo/smoke/
          if-no-files-found: warn
