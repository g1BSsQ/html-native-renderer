<!doctype html>
<style>
html, body { margin:0; background:#fff; }
#solid { position:absolute; left:20px; top:20px; width:40px; height:30px;
  border:10px solid transparent; background:red; background-clip:border-area; }
#double { position:absolute; left:20px; top:100px; width:40px; height:30px;
  border:9px double transparent; background:blue; background-clip:border-area; }
#rounded { position:absolute; left:90px; top:20px; width:30px; height:30px;
  border:10px solid transparent; border-radius:25px 15px;
  background:#008000; background-clip:border-area; }
#gradient { position:absolute; left:90px; top:105px; width:30px; height:30px;
  border:10px solid transparent; background-image:linear-gradient(#00ff00,#00ff00);
  background-clip:border-area; }
</style>
<div id="solid"></div><div id="double"></div><div id="rounded"></div><div id="gradient"></div>
