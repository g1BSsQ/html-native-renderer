<!doctype html><meta charset="utf-8"><style>
body { margin: 0; background: white; }
.box { position: absolute; overflow: clip; }
#rect { left: 20px; top: 20px; width: 30px; height: 30px; overflow-clip-margin: 8px; }
#rect .ink { position: absolute; left: 26px; top: 4px; width: 20px; height: 10px; background: red; }
#rounded { left: 90px; top: 20px; width: 40px; height: 40px; border-radius: 20px; overflow-clip-margin: 8px; }
#rounded .ink { position: absolute; left: -8px; top: -8px; width: 56px; height: 56px; background: red; }
</style>
<div id="rect" class="box"><div class="ink"></div></div>
<div id="rounded" class="box"><div class="ink"></div></div>
