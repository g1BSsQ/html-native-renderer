blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "92b11f1bd8ab7975411328b0406a95a09445b4e7", default-features = false }
anyrender = "=0.14.0"
anyrender_vello_cpu = "=0.18.0"
