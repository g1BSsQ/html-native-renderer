[package]
name = "vello_cpu"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false
description = "Pinned Vello CPU with signed, tile-phase-preserving destination crop"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
glifo = { version = "0.4.0", default-features = false, optional = true }
vello_common = { version = "=0.3.0", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
png = { version = "0.18.1", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
ordered-channel = { version = "1.2.0", optional = true, features = ["crossbeam-channel"] }
rayon = { version = "1.12.0", optional = true }
thread_local = { version = "1.1.9", optional = true }

[features]
default = ["std", "png", "text", "u8_pipeline"]
std = ["vello_common/std", "glifo?/std"]
libm = ["vello_common/libm", "glifo?/libm"]
png = ["std", "dep:png", "vello_common/png", "glifo?/png"]
multithreading = [
    "std",
    "dep:rayon",
    "dep:thread_local",
    "dep:ordered-channel",
    "dep:crossbeam-channel",
    "vello_common/multithreading",
]
text = ["dep:glifo"]
u8_pipeline = []
f32_pipeline = []
