# Local manifest based on published anyrender_vello_cpu 0.18.0 (cf0f1477).
# Resolves workspace-inherited fields and pins dependencies; changes the
# package description and drops upstream package metadata. The published
# optional window-renderer dependencies are removed, their feature flags
# are stubbed, and their log_frame_times forwards are omitted.
# render_window is a change to src/image_renderer.rs, not to this manifest.
[package]
repository = "https://github.com/DioxusLabs/anyrender"
name = "anyrender_vello_cpu"
version = "0.18.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Pinned CPU backend with viewport-origin compact pixmap rendering"

[features]
pixels_window_renderer = []
softbuffer_window_renderer = []
multithreading = ["vello_cpu/multithreading"]
log_frame_times = ["debug_timer/enable"]
filters = []

[dependencies]
anyrender = "=0.14.0"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
color = { version = "0.3", features = ["bytemuck"] }
debug_timer = "=0.1.3"
kurbo = "0.13.1"
peniko = "0.6"
glifo = "0.4"
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
vello_common = "=0.3.0"
